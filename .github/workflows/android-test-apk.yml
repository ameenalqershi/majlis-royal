name: Android Test APK - Visual Compare
on:
  push:
    branches:
      - feat/premium-lounge-ui-20261123
      - feat/claude-opus-royal-ui-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
      - name: Install Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: bash scripts/build-android.sh
      - name: Verify APK
        run: |
          test -s build/android/majlis.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/majlis.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/android/majlis.apk | head -10
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: majlis-android-${{ github.ref_name }}-${{ github.run_number }}
          path: build/android/majlis.apk
          if-no-files-found: error
          retention-days: 30
