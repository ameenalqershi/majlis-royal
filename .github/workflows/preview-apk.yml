name: Royal Majlis preview APK

on:
  push:
    branches:
      - feat/premium-lounge-ui-20261123
      - feat/claude-opus-royal-ui-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify engine and room tests
        run: node --test test/*.test.mjs
      - name: Build signed debug APK
        run: bash scripts/build-android.sh
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/majlis.apk
          test -s build/android/majlis.apk
          sha256sum build/android/majlis.apk
      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: royal-majlis-preview-${{ github.ref_name == 'feat/premium-lounge-ui-20261123' && 'original-ui' || 'claude-opus-ui' }}
          path: build/android/majlis.apk
          if-no-files-found: error
          retention-days: 30
